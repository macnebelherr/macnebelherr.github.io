name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      # Zugangsdaten liegen als GitHub Actions Secrets im Repo
      # (Settings -> Secrets and variables -> Actions), niemals im Code.
      - name: Deploy to Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: ${{ secrets.HOSTINGER_REMOTE_DIR }}
          sftp_only: true
